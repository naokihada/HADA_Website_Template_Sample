# HADA Website Template — machine-readable upgrade contract (v0.4.0)
# Template version is independent of config/project.yaml → project.version

manifest_version: "1.0"

schema_version: "0.1"

template:
  id: hada-website-template
  name: HADA Website Operations Framework
  version: "0.4.0"
  release: "v0.4.0"
  release_repository: naokihada/HADA_Website_Template

compatibility:
  schema_version: "0.1"
  data_format_version: "0.2"

files:
  template_base: TEMPLATE_BASE.md

repository:
  dev: HADA_Website_Template_Dev
  public: HADA_Website_Template
  sample: HADA_Website_Template_Sample

ownership:
  template:
    - "tools/core/**"
    - "tools/plugins/.gitkeep"
    - "tools/README.md"
    - "tests/**"
    - "docs/VALIDATION.md"
    - "docs/UPGRADE.md"
    - "docs/README.md"
    - "docs/DISPLAY.md"
    - "docs/BROWSER_UI.md"
    - "docs/MEDIA.md"
    - "CHANGELOG.md"
    - "AGENTS.md"
    - "README.md"
    - "LICENSE"
    - "DISCLAIMER.md"
    - ".gitignore"
    - "config/template.manifest.yaml"
    - "config/project.yaml"
    - "config/site.example.yaml"
    - "config/media.manifest.example.yaml"
    - "config/image-generation.example.yaml"
    - "config/illustration-generation.example.yaml"
    - "config/gallery.example.yaml"
    - "config/page-registry.example.yaml"
    - "config/display.example.yaml"
    - "config/local.example.yaml"
    - "config/term_dictionary.example.yaml"
    - "environments/environments.example.yaml"
    - "environments/README.md"
    - "references/registry/references.example.yaml"
    - "references/registry/README.md"
    - "content/README.md"
    - "site/README.md"
    - "site/index.html"
    - "site/timer.html"
    - "site/manifest.webmanifest"
    - "site/sw.js"
    - "site/assets/timer.js"
    - "site/assets/.gitkeep"
    - "site/assets/css/core.css"
    - "site/assets/js/display-preferences.js"
    - "AI/README.md"
    - "tools/core/upgrade_from_release.py"
    - "tools/core/assets.py"
    - "tools/core/page_registry.py"
    - "tools/core/tree_parity.py"
    - "tools/core/release_snapshot.py"
    - "tools/core/site_contract.py"
    - "tools/core/site_audit.py"
    - "tools/core/site_link_policy.py"
    - "tools/core/display_config.py"
    - "tools/core/external_dependency_scan.py"
    - "tools/core/external_javascript_policy.py"
    - "tests/test_v032_contracts.py"
    - "tests/test_site_link_policy.py"
    - "tests/test_display.py"
    - "tests/test_external_javascript_policy.py"
    - "tests/test_ui_contract.py"
    - "tests/test_promote_build.py"
    - "tests/test_browser_ui.py"
    - "tests/requirements-ui.txt"
    - "tools/core/ui_contract.py"
    - "tools/core/browser_contract.py"
    - "tools/core/promote_build.py"
  user:
    - "TEMPLATE_BASE.md"
    - "TEMPLATE_UPDATES.md"
    - "AI/tasks/**"
    - "AI/reports/**"
    - "AI/inbox/**"
    - "AI/outbox/**"
    - "content/jp/**"
    - "content/en/**"
    - "config/term_dictionary.yaml"
    - "config/site.yaml"
    - "config/local.yaml"
    - "site/assets/**"
    - "tests/project/**"
    - "site/en/**"
    - "site/jp/**"
    - "references/registry/**"
    - "references/cache/**"
    - "AI/logs/**"
    - "AI/state/**"
    - "AI/history/**"
    - "AI/inventory/**"
    - "AI/changelog/**"
    - "AI/screenshots/**"
    - "assets/images/master/**"
    - "assets/images/thumbnails/**"
    - "assets/metadata/images/**"
    - "config/image-generation.yaml"
    - "config/media.manifest.yaml"
    - "config/gallery.yaml"
  generated:
    - "content/en/**"
    - "site/en/**"
    - "site/jp/**"
    - "assets/images/web/**"

merge_policies:
  config/project.yaml:
    strategy: yaml_merge_preserve_user_keys
    preserve_keys:
      - project.name
      - project.mode
  site/index.html:
    strategy: three_way_text
  "AI/reports/**":
    strategy: preserve_if_modified

migrations:
  "0.1.1":
    to:
      - "0.1.2"
    notes: "Introduces template.manifest.yaml and upgrade_from_release.py"
  "0.1.2":
    to:
      - "0.1.3"
    notes: "Adds the client-only PWA timer demo with best-effort local notifications"
  "0.1.3":
    to:
      - "0.2.0"
    notes: "Migrates the agent workspace from .cursor/Cursor to AI and adds legacy workspace migration safeguards"
  "0.2.0":
    to:
      - "0.2.1"
    notes: "Adds the common manifest schema and compatibility metadata contract"
  "0.2.1":
    to:
      - "0.2.2"
    notes: "Adds built-in block-aware i18n master pipeline and arbitrary locale validation"
  "0.2.2":
    to:
      - "0.3.0"
    notes: "Adds persistent image metadata, thumbnails, gallery generation, and page-scoped visual library support"
  "0.3.0":
    to:
      - "0.3.1"
    notes: "Adds HTML Master registry, isolated candidate build, release snapshots, and tree parity checks"
  "0.3.1":
    to:
      - "0.3.2"
    notes: "Adds v0.3.2 static Web and optional display enhancement foundation"
  "0.3.2":
    to:
      - "0.3.3"
    notes: "Adds page-to-page Display State persistence with localStorage fallback safety"
  "0.3.3":
    to:
      - "0.4.0"
    notes: "Introduces the extensible media catalog, recursive collections, and static sequence/comic presentation; data structure may change and requires reviewed migration"
  "0.4.0":
    to: []
    notes: "Current baseline with media catalog schema 0.2 and static media collections"
